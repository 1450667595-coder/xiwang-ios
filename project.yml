name: XiWang
options:
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  XiWang:
    type: application
    platform: iOS
    sources:
      - path: XiWang

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.xiwang.personal
        INFOPLIST_FILE: XiWang/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.1.1"
        CURRENT_PROJECT_VERSION: "5"
  KneeHopeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests]
    dependencies:
      - target: XiWang
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cn.xiwang.tests
  KneeHopeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NativeUITests]
    dependencies:
      - target: XiWang
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cn.xiwang.uitests
schemes:
  XiWang:
    build:
      targets:
        XiWang: all
    archive:
      config: Release
    test:
      targets: [KneeHopeTests, KneeHopeUITests]
